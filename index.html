    <style>
        /* Polices */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

        :root {
            --bg-deep: #0f172a;
            --bg-mid: #1e293b;
            --card-bg: #111c2e;
            --border: #263449;
            --input-bg: #0b1120;
            --accent: #22c55e;
            --accent-dark: #16a34a;
            --accent-soft: #4ade80;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;

            /* Couleurs du drapeau togolais */
            --togo-green: #006a4e;
            --togo-yellow: #ffce00;
            --togo-red: #d21034;
            --togo-white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, var(--bg-mid) 0%, var(--bg-deep) 100%);
            color: var(--text-main);
            text-align: center;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* Cadre extérieur aux couleurs du drapeau togolais
           5 bandes horizontales vert/jaune (dans l'ordre du drapeau)
           + canton rouge à étoile blanche en haut à gauche */
        .flag-frame {
            width: 100%;
            max-width: 416px;
            padding: 7px;
            border-radius: 26px;
            position: relative;
            background: linear-gradient(180deg,
                    var(--togo-green) 0%,
                    var(--togo-green) 20%,
                    var(--togo-yellow) 20%,
                    var(--togo-yellow) 40%,
                    var(--togo-green) 40%,
                    var(--togo-green) 60%,
                    var(--togo-yellow) 60%,
                    var(--togo-yellow) 80%,
                    var(--togo-green) 80%,
                    var(--togo-green) 100%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* Canton rouge + étoile, positionné comme sur le vrai drapeau (haut-gauche) */
        .flag-frame::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 38%;
            height: 42%;
            background: var(--togo-red);
            border-radius: 26px 0 0 0;
            z-index: 1;
        }

        .flag-frame::after {
            content: "\2605";
            position: absolute;
            top: 13%;
            left: 13%;
            color: var(--togo-white);
            font-size: 22px;
            line-height: 1;
            z-index: 2;
        }

        /* Animation d'entrée pour la carte */
        .card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            position: relative;
            z-index: 5;
        }

        /* Petit drapeau du Togo affiché en en-tête */
        .togo-flag {
            width: 64px;
            height: 43px;
            margin: 0 auto 14px;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.15);
            display: block;
        }

        .togo-flag svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Titre avec Dégradé */
        h2 {
            text-align: center;
            font-size: 22px;
            margin: 0 0 8px;
            background: linear-gradient(90deg, var(--accent), var(--accent-soft));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleSlide 1s ease forwards;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 25px;
            animation: titleSlide 1.2s ease forwards;
        }

        @keyframes titleSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Barre recherche stylisée */
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 16px;
            border-radius: 12px;
            border: 2px solid var(--bg-mid);
            background: var(--input-bg);
            color: var(--text-main);
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.25);
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: white;
            font-family: inherit;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
        }

        /* Listes déroulantes partagées (suggestions + résultats multiples) */
        #suggestions,
        #matches {
            margin-top: 8px;
            padding: 0;
            list-style: none;
            background: var(--bg-deep);
            border-radius: 12px;
            display: none;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid var(--border);
            text-align: left;
        }

        #suggestions li,
        #matches li {
            padding: 12px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--bg-mid);
            cursor: pointer;
            transition: background 0.2s;
        }

        #suggestions li:last-child,
        #matches li:last-child {
            border-bottom: none;
        }

        #suggestions li:hover,
        #matches li:hover {
            background: var(--bg-mid);
            color: var(--accent-soft);
        }

        #matches li span {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        #matches li:hover span {
            color: var(--accent-soft);
            opacity: 0.8;
        }

        /* Résultat ultra-propre */
        #resultat {
            margin-top: 20px;
            padding: 25px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.75), rgba(11, 17, 32, 0.85));
            border: 1px solid rgba(255, 206, 0, 0.25);
            box-shadow: 0 0 0 1px rgba(0, 106, 78, 0.35) inset, 0 10px 30px rgba(0, 0, 0, 0.35);
            display: none;
            text-align: center;
            animation: resultPop 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.49);
        }

        @keyframes resultPop {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .info-group {
            padding: 6px 14px;
            border-radius: 10px;
            border-left: 4px solid var(--togo-green);
        }

        .info-group:nth-of-type(2n) {
            border-left-color: var(--togo-yellow);
        }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--togo-yellow);
            margin-bottom: 5px;
            text-align: left;
        }

        .value {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
            text-align: left;
        }

        .highlight {
            display: block;
            color: var(--accent-soft);
            font-size: 26px;
            font-weight: 800;
            text-align: center;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.45);
        }

        /* Carte */
        .map-status {
            font-size: 12px;
            color: var(--text-muted);
            margin: 14px 0 8px;
            display: none;
        }

        #map {
            display: none;
            height: 220px;
            border-radius: 12px;
            border: 1px solid var(--togo-yellow);
            margin-top: 4px;
            overflow: hidden;
        }

    </style>

        // Nettoyage automatique des données (espaces parasites autour des noms)
        // sans avoir à retoucher les centaines de lignes ci-dessus.
        baseTogo.forEach(item => {
            item.r = item.r.trim();
            item.p = item.p.trim();
            item.c = item.c.trim();
            item.can = item.can.trim();
            item.locs = item.locs.split(',').map(v => v.trim()).filter(Boolean).join(', ');
        });

        // Recherche insensible aux accents et à la casse (ex: "kpalime" trouve "Kpalimé")
        function normaliser(texte) {
            return texte
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim();
        }

        const input = document.getElementById('champ');
        const suggBox = document.getElementById('suggestions');
        const matchesBox = document.getElementById('matches');
        const resultBox = document.getElementById('resultat');
        const mapDiv = document.getElementById('map');
        const mapStatus = document.getElementById('map-status');
        let mapInstance = null;
        let markerInstance = null;

        input.addEventListener('input', () => {
            const texte = normaliser(input.value);
            suggBox.innerHTML = '';
            if (texte.length > 1) {
                const suggestions = new Set();
                baseTogo.forEach(item => {
                    item.locs.split(', ').forEach(ville => {
                        if (normaliser(ville).includes(texte)) {
                            suggestions.add(ville);
                        }
                    });
                });
                [...suggestions].slice(0, 30).forEach(ville => {
                    const li = document.createElement('li');
                    li.textContent = ville;
                    li.onclick = () => { input.value = ville; suggBox.style.display = 'none'; valider(); };
                    suggBox.appendChild(li);
                });
                suggBox.style.display = suggestions.size > 0 ? 'block' : 'none';
            } else {
                suggBox.style.display = 'none';
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { valider(); }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box')) {
                suggBox.style.display = 'none';
            }
        });

        function valider() {
            const saisie = normaliser(input.value);
            suggBox.style.display = 'none';
            matchesBox.style.display = 'none';
            matchesBox.innerHTML = '';
            resultBox.style.display = 'none';

            if (!saisie) return;

            // On collecte TOUTES les correspondances (une même localité peut exister
            // dans plusieurs cantons) au lieu de ne garder que la première trouvée.
            const correspondances = [];
            baseTogo.forEach(item => {
                item.locs.split(', ').forEach(ville => {
                    if (normaliser(ville) === saisie) {
                        correspondances.push({ ...item, locPrecise: ville });
                    }
                });
                if (normaliser(item.can) === saisie) {
                    correspondances.push({ ...item, locPrecise: item.can + " (chef-lieu de canton)" });
                }
            });

            if (correspondances.length === 0) {
                afficherAucunResultat();
            } else if (correspondances.length === 1) {
                afficherResultat(correspondances[0]);
            } else {
                afficherChoixMultiples(correspondances);
            }
        }

        function afficherAucunResultat() {
            resultBox.style.display = 'block';
            mapDiv.style.display = 'none';
            mapStatus.style.display = 'none';
            document.getElementById('res-loc').textContent = "Aucune localité trouvée";
            document.getElementById('res-r').textContent = '—';
            document.getElementById('res-p').textContent = '—';
            document.getElementById('res-c').textContent = '—';
            document.getElementById('res-can').textContent = '—';
        }

        function afficherChoixMultiples(liste) {
            matchesBox.style.display = 'block';
            liste.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${item.locPrecise}</strong><span>${item.can} — ${item.c}, ${item.p} (${item.r})</span>`;
                li.onclick = () => {
                    matchesBox.style.display = 'none';
                    afficherResultat(item);
                };
                matchesBox.appendChild(li);
            });
        }

        function afficherResultat(item) {
            resultBox.style.display = 'block';
            document.getElementById('res-loc').textContent = item.locPrecise;
            document.getElementById('res-r').textContent = item.r;
            document.getElementById('res-p').textContent = item.p;
            document.getElementById('res-c').textContent = item.c;
            document.getElementById('res-can').textContent = item.can;
            afficherCarte(item);
        }

        // Géolocalisation de la localité via l'API Nominatim (OpenStreetMap), avec
        // repli automatique au niveau du canton si la localité précise n'est pas référencée.
        async function afficherCarte(item) {
            mapStatus.style.display = 'block';

            if (!navigator.onLine) {
                mapDiv.style.display = 'none';
                mapStatus.textContent = "🔌 Vous êtes hors-ligne — la carte s'affichera automatiquement une fois la connexion rétablie.";
                const surReconnexion = () => { window.removeEventListener('online', surReconnexion); afficherCarte(item); };
                window.addEventListener('online', surReconnexion);
                return;
            }

            mapStatus.textContent = '📍 Recherche de la position...';

            try {
                const nomLoc = item.locPrecise.replace(/\s*\(chef-lieu de canton\)/, '');
                let coords = await geocoder(`${nomLoc}, ${item.can}, ${item.p}, Togo`);
                let precision = '📍 Position trouvée';

                if (!coords) {
                    coords = await geocoder(`${item.can}, ${item.p}, Togo`);
                    precision = '📍 Position approximative (niveau canton)';
                }
                if (!coords) {
                    coords = await geocoder(`${item.p}, Togo`);
                    precision = '📍 Position approximative (niveau préfecture)';
                }

                if (coords) {
                    afficherPointSurCarte(coords.lat, coords.lon, nomLoc);
                    mapStatus.textContent = precision;
                } else {
                    mapDiv.style.display = 'none';
                    mapStatus.textContent = "Position introuvable sur la carte pour cette localité.";
                }
            } catch (e) {
                mapDiv.style.display = 'none';
                mapStatus.textContent = "⚠️ Impossible de contacter le service de cartographie. Nouvelle tentative dans 5s...";
                setTimeout(() => afficherCarte(item), 5000);
            }
        }

        async function geocoder(requete) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(requete)}`;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            try {
                const rep = await fetch(url, { headers: { 'Accept-Language': 'fr' }, signal: controller.signal });
                clearTimeout(timeoutId);
                if (!rep.ok) return null;
                const data = await rep.json();
                if (data && data.length > 0) {
                    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
                }
                return null;
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function afficherPointSurCarte(lat, lon, label) {
            mapDiv.style.display = 'block';
            if (!mapInstance) {
                mapInstance = L.map(mapDiv).setView([lat, lon], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap contributors',
                    maxZoom: 18,
                }).addTo(mapInstance);
                markerInstance = L.marker([lat, lon]).addTo(mapInstance);
            } else {
                mapInstance.setView([lat, lon], 13);
                markerInstance.setLatLng([lat, lon]);
            }
            markerInstance.bindPopup(label).openPopup();
            setTimeout(() => mapInstance.invalidateSize(), 150);
        }
